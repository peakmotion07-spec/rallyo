<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rallyo - Retrait</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-24">

    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
        
        <div class="bg-white px-4 pt-5 pb-4 border-b border-gray-200 flex justify-between items-center sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <a href="home.html" class="text-gray-800"><i data-lucide="chevron-left" class="w-6 h-6"></i></a>
                <h1 class="text-base font-bold text-gray-900">Retrait</h1>
            </div>
            <a href="withdraw-history.html" class="text-xs font-bold text-blue-600">Historique</a>
        </div>

        <div class="flex-1 px-4 py-4 space-y-4">
            
            <div class="bg-slate-900 text-white p-5 rounded-2xl relative overflow-hidden shadow-md">
                <div class="relative z-10">
                    <p class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1">SOLDE DISPONIBLE</p>
                    <h2 id="current-balance" class="text-2xl font-extrabold text-white">0 FCFA</h2>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-bold text-sm text-gray-900 flex items-center gap-2">
                    <i data-lucide="info" class="w-4 h-4 text-red-600"></i>
                    <span>Conditions de retrait</span>
                </h3>
                <div class="space-y-2 text-xs">
                    <div class="flex items-center gap-2" id="cond-search">
                        <i data-lucide="circle" class="w-4 h-4 text-gray-300"></i>
                        <span class="text-gray-500">Effectuer une recharge</span>
                    </div>
                    <div class="flex items-center gap-2" id="cond-line">
                        <i data-lucide="circle" class="w-4 h-4 text-gray-300"></i>
                        <span class="text-gray-500">Lancer une ligne</span>
                    </div>
                    <div class="flex items-center gap-2" id="cond-ref">
                        <i data-lucide="circle" class="w-4 h-4 text-gray-300"></i>
                        <span class="text-gray-500">Parrainer quelqu'un</span>
                    </div>
                </div>
            </div>

            <div id="bound-account-card" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
                <!-- Rempli dynamiquement -->
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <div class="flex justify-between items-center text-xs">
                    <span class="font-bold text-gray-700 uppercase">Montant du retrait</span>
                    <span class="text-gray-400 text-[11px]">Frais : <strong class="text-red-600">18%</strong></span>
                </div>

                <div class="flex items-baseline border-b border-gray-100 pb-2">
                    <input type="number" id="withdraw-amount" placeholder="0" oninput="
                        let val = Number(this.value || 0);
                        document.getElementById('fee-display').textContent = (val * 0.18).toLocaleString() + ' FCFA';
                        document.getElementById('net-display').textContent = (val - (val * 0.18)).toLocaleString() + ' FCFA';
                    " class="w-full text-3xl font-black text-gray-900 outline-none bg-transparent">
                    <span class="font-bold text-gray-500 text-sm ml-2">FCFA</span>
                </div>

                <div class="pt-2 space-y-1 text-xs text-gray-500">
                    <div class="flex justify-between">
                        <span>Frais (18%) :</span>
                        <strong id="fee-display" class="text-gray-900">0 FCFA</strong>
                    </div>
                    <div class="flex justify-between">
                        <span>Montant net à recevoir :</span>
                        <strong id="net-display" class="text-green-600 font-bold">0 FCFA</strong>
                    </div>
                </div>
            </div>

            <!-- BOUTON AVEC LOGIQUE INTÉGRÉE -->
            <button type="button" onclick="
                let user = JSON.parse(localStorage.getItem('rallyo_user'));
                let amount = Number(document.getElementById('withdraw-amount').value);
                
                // Vérification du compte lié
                if(!user.bank_account || !user.bank_account.linked) {
                    alert('Veuillez d\'abord lier un compte de retrait.');
                    window.location.href = 'bank-account.html';
                    return;
                }
                
                // Vérification du minimum
                if(!amount || amount < 1500) {
                    alert('Le montant minimum de retrait est de 1 500 FCFA.');
                    return;
                }
                
                // Vérification du solde
                if(amount > Number(user.balance)) {
                    alert('Solde insuffisant.');
                    return;
                }
                
                // Vérification des conditions (on vérifie juste qu'elles ont été validées par le script)
                let cSearch = document.getElementById('cond-search').querySelector('i').getAttribute('data-lucide') === 'check-circle';
                let cLine = document.getElementById('cond-line').querySelector('i').getAttribute('data-lucide') === 'check-circle';
                let cRef = document.getElementById('cond-ref').querySelector('i').getAttribute('data-lucide') === 'check-circle';
                
                if(!cSearch || !cLine || !cRef) {
                    alert('Vous devez remplir toutes les conditions de retrait (Recherche, Ligne, Parrainage).');
                    return;
                }

                // Déduction du solde
                user.balance = Number(user.balance) - amount;
                localStorage.setItem('rallyo_user', JSON.stringify(user));
                
                alert('Demande de retrait de ' + amount.toLocaleString() + ' FCFA envoyée avec succès !');
                window.location.href = 'home.html';
            " class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-2xl text-xs uppercase tracking-wider shadow-lg shadow-red-600/30 transition">
                Confirmer le retrait
            </button>

        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center z-50">
            <a href="home.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Accueil</span></a>
            <a href="lines.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="layers" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Lignes</span></a>
            <a href="team.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Équipe</span></a>
            <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Profil</span></a>
        </div>

    </div>

    <script>
        function loadIcons() { if (window.lucide) lucide.createIcons(); }
        window.onload = loadIcons;
        setTimeout(loadIcons, 1000);

        const user = JSON.parse(localStorage.getItem('rallyo_user'));
        if (!user) window.location.href = 'index.html';

        document.getElementById('current-balance').textContent = `${Number(user.balance || 0).toLocaleString()} FCFA`;

        // Affichage du compte
        const boundCard = document.getElementById('bound-account-card');
        if (!user.bank_account || !user.bank_account.linked) {
            boundCard.innerHTML = `
                <div class="flex items-center gap-3 text-amber-600">
                    <i data-lucide="alert-circle" class="w-5 h-5"></i>
                    <span class="text-xs font-bold">Aucun compte lié</span>
                </div>
                <a href="bank-account.html" class="bg-red-600 text-white text-xs font-bold px-3 py-2 rounded-xl">Lier</a>
            `;
        } else {
            boundCard.innerHTML = `
                <div>
                    <span class="text-[10px] font-bold text-gray-400 uppercase">Compte de retrait</span>
                    <h4 class="font-bold text-sm text-gray-900 mt-0.5">${user.bank_account.operator} (${user.bank_account.number})</h4>
                </div>
                <a href="bank-account.html" class="text-xs font-bold text-blue-600">Modifier</a>
            `;
        }

        // Vérification des conditions (tentative de connexion Supabase)
        async function checkConditions() {
            try {
                const supabase = window.supabase.createClient('https://afkungjbyjxibnkkflab.supabase.co', 'sb_publishable_YI20-tV_eeIysnLJtnoQkA_GcF3VR74');
                
                // Vérifier les lignes achetées
                const { data: inv } = await supabase.from('investments').select('id').eq('user_id', user.id).limit(1);
                if (inv && inv.length > 0) {
                    document.getElementById('cond-search').querySelector('i').setAttribute('data-lucide', 'check-circle');
                    document.getElementById('cond-search').querySelector('i').className = "w-4 h-4 text-green-600";
                    document.getElementById('cond-search').querySelector('span').className = "text-gray-900 font-medium line-through decoration-green-500";
                    
                    document.getElementById('cond-line').querySelector('i').setAttribute('data-lucide', 'check-circle');
                    document.getElementById('cond-line').querySelector('i').className = "w-4 h-4 text-green-600";
                    document.getElementById('cond-line').querySelector('span').className = "text-gray-900 font-medium line-through decoration-green-500";
                }

                // Vérifier les filleuls
                const { data: ref } = await supabase.from('profiles').select('id').eq('referred_by', user.id).limit(1);
                if (ref && ref.length > 0) {
                    document.getElementById('cond-ref').querySelector('i').setAttribute('data-lucide', 'check-circle');
                    document.getElementById('cond-ref').querySelector('i').className = "w-4 h-4 text-green-600";
                    document.getElementById('cond-ref').querySelector('span').className = "text-gray-900 font-medium line-through decoration-green-500";
                }

                if(window.lucide) lucide.createIcons();
            } catch(e) { console.log("Mode hors-ligne"); }
        }
        checkConditions();
    </script>
</body>
</html>
