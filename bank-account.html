<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rallyo - Compte de retrait</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-24">

    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
        
        <!-- En-tête -->
        <div class="bg-white px-4 pt-5 pb-4 border-b border-gray-200 flex items-center gap-3 sticky top-0 z-40">
            <a href="profile.html" class="text-gray-800"><i data-lucide="chevron-left" class="w-6 h-6"></i></a>
            <h1 class="text-base font-bold text-gray-900">Compte de retrait</h1>
        </div>

        <!-- Corps -->
        <div class="flex-1 px-4 py-4 space-y-4" id="account-container">
            <!-- Injecté dynamiquement selon si le compte est lié ou non -->
        </div>

        <!-- Barre de navigation inférieure -->
        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center z-50">
            <a href="home.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <i data-lucide="home" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold mt-1">Accueil</span>
            </a>
            <a href="lines.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <i data-lucide="layers" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold mt-1">Lignes</span>
            </a>
            <a href="team.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600">
                <i data-lucide="users" class="w-5 h-5"></i>
                <span class="text-[10px] font-semibold mt-1">Équipe</span>
            </a>
            <a href="profile.html" class="flex flex-col items-center text-red-600">
                <i data-lucide="user" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold mt-1">Profil</span>
            </a>
        </div>

    </div>

    <script>
        lucide.createIcons();
        const user = JSON.parse(localStorage.getItem('rallyo_user'));
        if (!user) window.location.href = 'index.html';

        const container = document.getElementById('account-container');

        function renderAccount() {
            if (user.bank_account && user.bank_account.linked) {
                container.innerHTML = `
                    <div class="bg-slate-900 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden space-y-4">
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-bold text-gray-300">${user.bank_account.operator}</span>
                            <i data-lucide="landmark" class="w-5 h-5 text-gray-400"></i>
                        </div>
                        <div>
                            <p class="text-2xl font-black tracking-widest">${user.bank_account.number}</p>
                            <p class="text-xs text-gray-400 mt-1">${user.bank_account.holder}</p>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                        <div class="flex justify-between items-center py-2 border-b border-gray-100 text-xs">
                            <span class="text-gray-400 font-semibold">Numéro de compte</span>
                            <strong class="text-gray-900">${user.bank_account.number}</strong>
                        </div>
                        <div class="flex justify-between items-center py-2 text-xs">
                            <span class="text-gray-400 font-semibold">Nom du titulaire</span>
                            <strong class="text-gray-900">${user.bank_account.holder}</strong>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-2">
                        <button onclick="openLinkForm()" class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold py-3 rounded-xl text-xs transition">Modifier</button>
                        <button onclick="unlinkAccount()" class="bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3 rounded-xl text-xs transition">Dissocier</button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 space-y-4">
                        <h3 class="font-bold text-sm text-gray-900">Lier un compte de retrait</h3>
                        <p class="text-xs text-gray-500">Ce compte sera utilisé pour verser l'ensemble de vos retraits.</p>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1">Opérateur / Pays</label>
                                <select id="bank-op" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 text-xs font-bold text-gray-900 outline-none">
                                    <option>Orange Money (Burkina Faso)</option>
                                    <option>Moov Money (Burkina Faso)</option>
                                    <option>MTN / Orange (Cameroun)</option>
                                    <option>Wave (Côte d'Ivoire)</option>
                                    <option>Mobile Money (Côte d'Ivoire)</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1">Numéro de compte / Téléphone</label>
                                <input type="tel" id="bank-num" placeholder="Ex: 06461372" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 text-xs font-bold text-gray-900 outline-none">
                            </div>
                            <div>
                                <label class="block text-[11px] font-bold text-gray-700 uppercase mb-1">Nom du titulaire</label>
                                <input type="text" id="bank-holder" placeholder="Ex: Florence Bamogo" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3 py-3 text-xs font-bold text-gray-900 outline-none">
                            </div>
                        </div>

                        <button onclick="saveAccount()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-red-600/20 transition mt-2">
                            Lier le compte
                        </button>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function openLinkForm() {
            user.bank_account = { linked: false };
            localStorage.setItem('rallyo_user', JSON.stringify(user));
            renderAccount();
        }

        function saveAccount() {
            const op = document.getElementById('bank-op').value;
            const num = document.getElementById('bank-num').value.trim();
            const holder = document.getElementById('bank-holder').value.trim();

            if (!num || !holder) {
                alert("Veuillez remplir tous les champs avec précision.");
                return;
            }

            user.bank_account = { linked: true, operator: op, number: num, holder: holder };
            localStorage.setItem('rallyo_user', JSON.stringify(user));
            alert("Compte de retrait lié avec succès !");
            renderAccount();
        }

        function unlinkAccount() {
            if (confirm("Voulez-vous vraiment dissocier ce compte ?")) {
                user.bank_account = { linked: false };
                localStorage.setItem('rallyo_user', JSON.stringify(user));
                renderAccount();
            }
        }

        renderAccount();
    </script>
</body>
</html>
