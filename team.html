<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rallyo - Équipe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-24">

    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
        
        <div class="bg-slate-900 text-white pt-6 pb-8 px-6 rounded-b-3xl shadow-lg relative overflow-hidden">
            <div class="relative z-10">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-3">
                        <img src="logo.png" alt="Rallyo" class="w-9 h-9 rounded-xl shadow-lg">
                        <span class="font-bold text-lg tracking-wider">RALLYO ÉQUIPE</span>
                    </div>
                </div>

                <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 mb-4">
                    <p class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Total Commissions</p>
                    <h2 id="team-earnings" class="text-3xl font-extrabold text-white">0 FCFA</h2>
                </div>

                <!-- BLOC CODE DE PARRAINAGE -->
                <div class="bg-slate-800/80 border border-white/10 rounded-2xl p-3.5 flex items-center justify-between mb-3">
                    <div>
                        <p class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Votre Code</p>
                        <p id="user-ref-code" class="text-lg font-black text-red-500 tracking-wider mt-0.5">...</p>
                    </div>
                    <button onclick="copyCode()" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-3.5 py-2 rounded-xl shadow transition flex items-center gap-1.5">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                        <span>Copier</span>
                    </button>
                </div>

                <!-- BLOC LIEN DE PARRAINAGE -->
                <div class="bg-slate-800/80 border border-white/10 rounded-2xl p-3.5 space-y-2">
                    <p class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold">Votre Lien d'invitation</p>
                    <div class="flex items-center gap-2">
                        <input type="text" id="user-ref-link" readonly class="w-full bg-slate-900 text-xs text-white px-3 py-2.5 rounded-lg border border-white/10 outline-none font-mono">
                        <button onclick="copyLink()" class="bg-white text-slate-900 hover:bg-gray-100 font-bold text-xs px-3 py-2.5 rounded-lg shadow transition flex-shrink-0">
                            Copier
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 px-4 py-5 space-y-5">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 space-y-3">
                <h3 class="font-bold text-sm text-gray-900 flex items-center gap-2">
                    <i data-lucide="award" class="w-4 h-4 text-red-600"></i>
                    <span>Commissions</span>
                </h3>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-red-50 border border-red-100 rounded-xl p-2.5">
                        <span class="block text-[10px] font-bold text-gray-500">NIVEAU 1</span>
                        <strong class="text-red-600 text-base font-black">37%</strong>
                    </div>
                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-2.5">
                        <span class="block text-[10px] font-bold text-gray-500">NIVEAU 2</span>
                        <strong class="text-gray-800 text-base font-black">5%</strong>
                    </div>
                    <div class="bg-gray-50 border border-gray-100 rounded-xl p-2.5">
                        <span class="block text-[10px] font-bold text-gray-500">NIVEAU 3</span>
                        <strong class="text-gray-800 text-base font-black">2%</strong>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-3 bg-gray-200 p-1 rounded-xl text-xs font-bold text-center">
                <button onclick="switchTab(1)" id="tab-1" class="py-2 rounded-lg bg-white text-gray-900 shadow-sm transition">Niveau 1 (<span id="count-1">0</span>)</button>
                <button onclick="switchTab(2)" id="tab-2" class="py-2 rounded-lg text-gray-500 transition">Niveau 2 (<span id="count-2">0</span>)</button>
                <button onclick="switchTab(3)" id="tab-3" class="py-2 rounded-lg text-gray-500 transition">Niveau 3 (<span id="count-3">0</span>)</button>
            </div>

            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 min-h-[180px] space-y-3">
                <div id="team-list" class="space-y-3">
                    <p class="text-center text-xs text-gray-400 animate-pulse py-4">Chargement de l'équipe...</p>
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center z-50">
            <a href="home.html" class="flex flex-col items-center text-gray-400"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Accueil</span></a>
            <a href="lines.html" class="flex flex-col items-center text-gray-400"><i data-lucide="layers" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Lignes</span></a>
            <a href="team.html" class="flex flex-col items-center text-red-600"><i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Équipe</span></a>
            <a href="profile.html" class="flex flex-col items-center text-gray-400"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Profil</span></a>
        </div>
    </div>

    <script>
        // 1. Récupération de l'utilisateur
        const user = JSON.parse(localStorage.getItem('rallyo_user'));
        if (!user) window.location.href = 'index.html';
        
        // 2. Préparation du code et du lien
        const myCode = user.referral_code || 'RAL0000';
        // On génère le lien basé sur l'URL actuelle du site
        const baseUrl = window.location.origin + window.location.pathname.replace('team.html', 'index.html');
        const myLink = baseUrl + '?ref=' + myCode;

        // 3. Affichage IMMÉDIAT
        document.getElementById('user-ref-code').textContent = myCode;
        document.getElementById('user-ref-link').value = myLink;

        // 4. Initialisation des icônes
        window.onload = function() { if (window.lucide) lucide.createIcons(); };
        setTimeout(() => { if (window.lucide) lucide.createIcons(); }, 1000);

        // 5. Fonctions de copie
        function copyCode() {
            navigator.clipboard.writeText(myCode);
            alert("Code copié : " + myCode);
        }

        function copyLink() {
            navigator.clipboard.writeText(myLink);
            alert("Lien copié : " + myLink);
        }

        // 6. Chargement des niveaux
        async function loadTeamLevel(level) {
            const listContainer = document.getElementById('team-list');
            listContainer.innerHTML = '<p class="text-center text-xs text-gray-400 animate-pulse py-4">Chargement...</p>';

            try {
                const supabase = window.supabase.createClient('https://afkungjbyjxibnkkflab.supabase.co', 'sb_publishable_YI20-tV_eeIysnLJtnoQkA_GcF3VR74');
                
                const { data: level1 } = await supabase.from('profiles').select('*').eq('referred_by', user.id);
                let currentIds = [user.id];
                let allUsers = { 1: level1 || [] };

                for (let i = 2; i <= 3; i++) {
                    if (currentIds.length === 0) { allUsers[i] = []; continue; }
                    const { data: levelData } = await supabase.from('profiles').select('*').in('referred_by', currentIds);
                    allUsers[i] = levelData || [];
                    currentIds = levelData ? levelData.map(u => u.id) : [];
                }

                document.getElementById('count-1').textContent = allUsers[1].length;
                document.getElementById('count-2').textContent = allUsers[2].length;
                document.getElementById('count-3').textContent = allUsers[3].length;

                const displayList = allUsers[level];
                
                if (displayList.length === 0) {
                    listContainer.innerHTML = `
                        <div class="text-center py-8 text-gray-400 text-xs">
                            <i data-lucide="users" class="w-8 h-8 mx-auto mb-2 opacity-30"></i>
                            Aucun filleul au niveau ${level} pour le moment.
                        </div>
                    `;
                } else {
                    listContainer.innerHTML = displayList.map(member => {
                        const maskedPhone = member.phone.substring(0, 4) + '****' + member.phone.substring(member.phone.length - 2);
                        const joined = new Date(member.created_at).toLocaleDateString('fr-FR');
                        return `
                            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl">
                                <div class="flex items-center gap-3">
                                    <div class="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-xs">
                                        <i data-lucide="user" class="w-4 h-4"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-xs text-gray-900">${maskedPhone}</h4>
                                        <p class="text-[10px] text-gray-500">Inscrit le ${joined}</p>
                                    </div>
                                </div>
                                <span class="text-[10px] font-bold text-green-600 bg-green-50 px-2 py-1 rounded-md">Actif</span>
                            </div>
                        `;
                    }).join('');
                }
                if (window.lucide) lucide.createIcons();
            } catch(e) {
                listContainer.innerHTML = '<p class="text-center text-xs text-red-500 py-4">Erreur de connexion.</p>';
            }
        }

        window.switchTab = function(level) {
            for (let i = 1; i <= 3; i++) {
                const tab = document.getElementById(`tab-${i}`);
                tab.className = i === level ? "py-2 rounded-lg bg-white text-gray-900 shadow-sm transition" : "py-2 rounded-lg text-gray-500 transition";
            }
            loadTeamLevel(level);
        };

        // Lancer le niveau 1 au démarrage
        loadTeamLevel(1);
    </script>
</body>
</html>
