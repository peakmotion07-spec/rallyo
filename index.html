<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rallyo - Connexion & Inscription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden">

    <div class="absolute inset-0 z-0 opacity-25">
        <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=1200&q=80" alt="Fond" class="w-full h-full object-cover">
    </div>

    <div class="relative z-10 p-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="logo.png" alt="Rallyo" class="w-10 h-10 rounded-xl shadow-lg shadow-red-600/30">
            <span class="font-extrabold text-lg tracking-wider text-white">RALLYO</span>
        </div>
    </div>

    <div class="relative z-10 max-w-md w-full mx-auto px-6 pb-6 space-y-6">
        
        <div class="space-y-3">
            <h1 class="text-2xl font-black tracking-tight" id="main-title">Créez votre compte</h1>
            <div id="bonus-card" class="bg-white/10 backdrop-blur-md border border-white/15 rounded-2xl p-3.5 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-xl bg-red-600/30 flex items-center justify-center text-red-500 font-bold">
                        <i data-lucide="gift" class="w-4 h-4"></i>
                    </div>
                    <div>
                        <p class="text-[10px] uppercase tracking-wider text-gray-300 font-semibold">Bonus de bienvenue</p>
                        <p class="text-xs text-white font-medium">Crédité à l'inscription</p>
                    </div>
                </div>
                <span class="text-sm font-black text-white bg-red-600 px-3 py-1.5 rounded-xl shadow">800 FCFA</span>
            </div>
        </div>

        <div class="bg-white text-gray-900 rounded-[35px] p-6 shadow-2xl space-y-5 relative">
            <div class="grid grid-cols-2 bg-gray-100 p-1.5 rounded-2xl">
                <!-- Boutons d'onglets avec action directe -->
                <button type="button" id="btn-login-tab" onclick="
                    document.getElementById('btn-login-tab').className = 'py-3 text-xs font-bold rounded-xl transition bg-white text-gray-900 shadow-sm';
                    document.getElementById('btn-register-tab').className = 'py-3 text-xs font-bold rounded-xl transition text-gray-500';
                    document.getElementById('main-title').textContent = 'Bon retour parmi nous';
                    document.getElementById('bonus-card').style.display = 'none';
                    document.getElementById('confirm-password-container').style.display = 'none';
                    document.getElementById('ref-container').style.display = 'none';
                    document.getElementById('submit-action-btn').textContent = 'Se connecter';
                    document.getElementById('submit-action-btn').setAttribute('data-mode', 'login');
                " class="py-3 text-xs font-bold rounded-xl transition text-gray-500 hover:text-gray-900">Connexion</button>

                <button type="button" id="btn-register-tab" onclick="
                    document.getElementById('btn-register-tab').className = 'py-3 text-xs font-bold rounded-xl transition bg-white text-gray-900 shadow-sm';
                    document.getElementById('btn-login-tab').className = 'py-3 text-xs font-bold rounded-xl transition text-gray-500';
                    document.getElementById('main-title').textContent = 'Créez votre compte';
                    document.getElementById('bonus-card').style.display = 'flex';
                    document.getElementById('confirm-password-container').style.display = 'block';
                    document.getElementById('ref-container').style.display = 'block';
                    document.getElementById('submit-action-btn').textContent = 'Créer un compte';
                    document.getElementById('submit-action-btn').setAttribute('data-mode', 'register');
                " class="py-3 text-xs font-bold rounded-xl transition bg-white text-gray-900 shadow-sm">Créer un compte</button>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Numéro de téléphone</label>
                    <div class="flex items-center bg-gray-50 border border-gray-200 rounded-2xl px-3 py-2.5 focus-within:border-red-600 transition relative">
                        <div class="relative mr-2.5">
                            <button type="button" onclick="document.getElementById('country-dropdown').classList.toggle('hidden'); event.stopPropagation();" class="flex items-center gap-2 bg-slate-900 text-white text-xs font-black py-2.5 px-3.5 rounded-xl shadow-sm hover:bg-slate-800 transition">
                                <span id="selected-flag" class="text-sm">🇧🇫</span>
                                <span id="selected-code" class="text-xs tracking-wider">+226</span>
                                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-400"></i>
                            </button>
                            <div id="country-dropdown" class="hidden absolute left-0 top-14 w-40 bg-slate-900 border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-50 divide-y divide-white/5">
                                <div onclick="document.getElementById('selected-flag').textContent='🇧🇫'; document.getElementById('selected-code').textContent='+226'; document.getElementById('country-dropdown').classList.add('hidden');" class="flex items-center gap-2.5 px-4 py-3 text-xs font-bold text-white hover:bg-red-600 cursor-pointer"><span class="text-sm">🇧🇫</span> <span>+226</span></div>
                                <div onclick="document.getElementById('selected-flag').textContent='🇨🇮'; document.getElementById('selected-code').textContent='+225'; document.getElementById('country-dropdown').classList.add('hidden');" class="flex items-center gap-2.5 px-4 py-3 text-xs font-bold text-white hover:bg-red-600 cursor-pointer"><span class="text-sm">🇨🇮</span> <span>+225</span></div>
                            </div>
                        </div>
                        <input type="tel" id="phone" placeholder="Saisissez votre numéro" class="w-full bg-transparent text-xs text-gray-900 outline-none placeholder-gray-400 font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Mot de passe</label>
                    <input type="password" id="password" placeholder="Saisissez votre mot de passe" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs text-gray-900 outline-none focus:border-red-600 transition placeholder-gray-400 font-medium">
                </div>

                <div id="confirm-password-container">
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Confirmer le mot de passe</label>
                    <input type="password" id="confirm-password" placeholder="Répétez le mot de passe" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs text-gray-900 outline-none focus:border-red-600 transition placeholder-gray-400 font-medium">
                </div>

                <div id="ref-container">
                    <label class="block text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Code d'invitation (Facultatif)</label>
                    <input type="text" id="ref-code" placeholder="EX: RAL1234" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3 text-xs text-gray-900 outline-none focus:border-red-600 transition placeholder-gray-400 font-medium uppercase">
                </div>

                <!-- Le bouton principal qui gère l'inscription/connexion -->
                <button type="button" id="submit-action-btn" data-mode="register" onclick="
                    const mode = this.getAttribute('data-mode');
                    const btn = this;
                    btn.textContent = 'Chargement...'; btn.disabled = true;
                    
                    const phone = document.getElementById('selected-code').textContent + document.getElementById('phone').value.trim();
                    const pass = document.getElementById('password').value.trim();
                    const confirm = document.getElementById('confirm-password').value.trim();
                    const ref = document.getElementById('ref-code').value.trim().toUpperCase();
                    
                    if(!phone || phone.length < 8 || !pass) { alert('Remplissez tous les champs.'); btn.textContent = (mode === 'login' ? 'Se connecter' : 'Créer un compte'); btn.disabled = false; return; }
                    if(mode === 'register' && pass !== confirm) { alert('Les mots de passe ne correspondent pas.'); btn.textContent = 'Créer un compte'; btn.disabled = false; return; }
                    
                    const supabase = window.supabase.createClient('https://afkungjbyjxibnkkflab.supabase.co', 'sb_publishable_YI20-tV_eeIysnLJtnoQkA_GcF3VR74');
                    
                    if(mode === 'login') {
                        supabase.from('profiles').select('*').eq('phone', phone).eq('password', pass).single().then(({data, error}) => {
                            if(error || !data) { alert('Numéro ou mot de passe incorrect.'); btn.textContent = 'Se connecter'; btn.disabled = false; return; }
                            localStorage.setItem('rallyo_user', JSON.stringify(data));
                            window.location.href = 'home.html';
                        });
                    } else {
                        supabase.from('profiles').select('id').eq('phone', phone).single().then(({data}) => {
                            if(data) { alert('Ce numéro est déjà inscrit.'); btn.textContent = 'Créer un compte'; btn.disabled = false; return; }
                            
                            let myRef = 'RAL' + Math.floor(1000 + Math.random() * 9000);
                            let sponsorId = null;
                            
                            let checkSponsor = ref ? supabase.from('profiles').select('id').eq('referral_code', ref).single() : Promise.resolve({data: null});
                            
                            checkSponsor.then(({data: sponsor}) => {
                                if(sponsor) sponsorId = sponsor.id;
                                
                                supabase.from('profiles').insert([{ phone, password: pass, balance: 800, referral_code: myRef, referred_by: sponsorId, wheel_spins: 0 }]).select().single().then(({data: newUser, error}) => {
                                    if(error) { alert('Erreur.'); btn.textContent = 'Créer un compte'; btn.disabled = false; return; }
                                    localStorage.setItem('rallyo_user', JSON.stringify(newUser));
                                    alert('Compte créé ! 800 FCFA crédités.');
                                    window.location.href = 'home.html';
                                });
                            });
                        });
                    }
                " class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-red-600/30 transition text-xs tracking-wider uppercase mt-2">
                    Créer un compte
                </button>
            </div>
        </div>
    </div>

    <script>
        if (window.lucide) lucide.createIcons();
        
        // Remplir le code de parrainage si présent dans l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const refLink = urlParams.get('ref');
        if (refLink) { document.getElementById('ref-code').value = refLink.toUpperCase(); }

        // Fermer le menu déroulant au clic extérieur
        window.addEventListener('click', function(e) {
            const dropdown = document.getElementById('country-dropdown');
            if(dropdown && !dropdown.classList.contains('hidden') && !e.target.closest('button')) {
                dropdown.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
