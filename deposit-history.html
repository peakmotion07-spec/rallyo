<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rallyo - Historique des dépôts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-24">

    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
        
        <div class="bg-white px-4 pt-5 pb-4 border-b border-gray-200 flex items-center gap-3 sticky top-0 z-40">
            <a href="recharge.html" class="text-gray-800"><i data-lucide="chevron-left" class="w-6 h-6"></i></a>
            <h1 class="text-base font-bold text-gray-900">Historique des dépôts</h1>
        </div>

        <div class="flex-1 px-4 py-4 space-y-3" id="history-container">
            <div class="text-center py-10 text-gray-400 text-sm animate-pulse">Chargement...</div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center z-50">
            <a href="home.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Accueil</span></a>
            <a href="lines.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="layers" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Lignes</span></a>
            <a href="team.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Équipe</span></a>
            <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Profil</span></a>
        </div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://afkungjbyjxibnkkflab.supabase.co', 'sb_publishable_YI20-tV_eeIysnLJtnoQkA_GcF3VR74');
        const user = JSON.parse(localStorage.getItem('rallyo_user'));
        
        if (!user) window.location.href = 'index.html';
        if (window.lucide) lucide.createIcons();

        async function loadHistory() {
            const { data, error } = await supabase
                .from('transactions')
                .select('*')
                .eq('user_id', user.id)
                .eq('type', 'deposit')
                .order('created_at', { ascending: false });

            const container = document.getElementById('history-container');

            if (error || !data || data.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 flex flex-col items-center">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-gray-400 mb-3">
                            <i data-lucide="inbox" class="w-8 h-8"></i>
                        </div>
                        <p class="text-sm text-gray-500 font-medium">Aucun dépôt pour le moment.</p>
                        <a href="recharge.html" class="mt-4 bg-red-600 text-white text-xs font-bold px-5 py-2.5 rounded-xl">Faire un dépôt</a>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
                return;
            }

            container.innerHTML = data.map(tx => {
                const date = new Date(tx.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                let statusBadge = '';
                if (tx.status === 'pending') statusBadge = '<span class="text-[10px] font-bold bg-amber-100 text-amber-700 px-2 py-1 rounded-md">En attente</span>';
                else if (tx.status === 'completed') statusBadge = '<span class="text-[10px] font-bold bg-green-100 text-green-700 px-2 py-1 rounded-md">Validé</span>';
                else statusBadge = '<span class="text-[10px] font-bold bg-red-100 text-red-700 px-2 py-1 rounded-md">Rejeté</span>';

                return `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex justify-between items-center">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-green-50 text-green-600 flex items-center justify-center">
                                <i data-lucide="arrow-down-left" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-gray-900">+${Number(tx.amount).toLocaleString()} FCFA</h4>
                                <p class="text-[10px] text-gray-500 mt-0.5">${date}</p>
                                ${tx.transaction_code ? `<p class="text-[10px] text-gray-400 font-mono mt-0.5">Code: ${tx.transaction_code}</p>` : ''}
                            </div>
                        </div>
                        <div>${statusBadge}</div>
                    </div>
                `;
            }).join('');
            
            if (window.lucide) lucide.createIcons();
        }
        loadHistory();
    </script>
</body>
</html>
