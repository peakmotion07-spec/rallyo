<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rallyo - Roue de la fortune</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .spin-animation {
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .wheel-bg {
            background: conic-gradient(
                #ef4444 0deg 45deg,
                #1e293b 45deg 90deg,
                #f59e0b 90deg 135deg,
                #1e293b 135deg 180deg,
                #ef4444 180deg 225deg,
                #1e293b 225deg 270deg,
                #f59e0b 270deg 315deg,
                #1e293b 315deg 360deg
            );
        }
    </style>
</head>
<body class="bg-slate-900 text-white font-sans antialiased min-h-screen flex flex-col">

    <div class="max-w-md w-full mx-auto flex-1 flex flex-col relative overflow-hidden">
        
        <!-- En-tête -->
        <div class="p-6 flex justify-between items-center z-10">
            <a href="home.html" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-md hover:bg-white/20 transition">
                <i data-lucide="chevron-left" class="w-6 h-6 text-white"></i>
            </a>
            <div class="bg-white/10 px-4 py-1.5 rounded-full backdrop-blur-md border border-white/20">
                <span class="text-xs font-bold text-white">Solde: <span id="user-balance">0</span> FCFA</span>
            </div>
        </div>

        <!-- Contenu -->
        <div class="flex-1 flex flex-col items-center justify-center px-6 pb-10 z-10">
            
            <div class="text-center mb-8">
                <h1 class="text-2xl font-black mb-2">Roue de la Fortune</h1>
                <!-- Affichage du nombre de tours -->
                <div class="inline-block bg-yellow-500/20 border border-yellow-500/50 px-4 py-2 rounded-xl">
                    <p class="text-xs text-yellow-400 font-bold">Tours disponibles : <span id="spins-count" class="text-sm">0</span></p>
                </div>
            </div>

            <!-- Roue -->
            <div class="relative w-72 h-72 mb-10">
                <!-- Flèche (indicateur) -->
                <div class="absolute -top-5 left-1/2 -translate-x-1/2 z-30">
                    <div class="w-0 h-0 border-l-[20px] border-l-transparent border-r-[20px] border-r-transparent border-t-[35px] border-t-white drop-shadow-lg"></div>
                </div>

                <!-- Cercle extérieur -->
                <div class="w-full h-full rounded-full border-[6px] border-slate-700 shadow-2xl overflow-hidden relative bg-slate-800">
                    
                    <!-- La roue qui tourne -->
                    <div id="wheel" class="w-full h-full wheel-bg relative spin-animation flex items-center justify-center rounded-full">
                        <!-- Textes -->
                        <span class="absolute top-6 text-white font-black text-sm">0</span>
                        <span class="absolute top-14 right-6 text-white font-black text-sm rotate-45">50</span>
                        <span class="absolute top-1/2 right-4 text-white font-black text-sm rotate-90 -mt-2">100</span>
                        <span class="absolute bottom-14 right-6 text-white font-black text-sm rotate-135">200</span>
                        <span class="absolute bottom-6 text-white font-black text-sm rotate-180">500</span>
                        <span class="absolute bottom-14 left-6 text-white font-black text-sm -rotate-135">100</span>
                        <span class="absolute top-1/2 left-4 text-white font-black text-sm -rotate-90 -mt-2">50</span>
                        <span class="absolute top-14 left-6 text-white font-black text-sm -rotate-45">1000</span>

                        <!-- Cercle central -->
                        <div class="absolute w-24 h-24 bg-slate-900 rounded-full border-4 border-slate-700 z-10"></div>
                    </div>
                </div>
                
                <!-- Bouton central -->
                <button onclick="spinWheel()" id="spin-btn" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 bg-red-600 hover:bg-red-500 rounded-full shadow-xl z-20 flex items-center justify-center font-black text-xs transition transform active:scale-95 border-4 border-slate-900 text-white">
                    TOURNER
                </button>
            </div>

            <p class="text-[10px] text-gray-500 text-center max-w-xs">
                Gagnez 1 tour en lançant une ligne.<br>Gagnez 1 tour quand un filleul lance sa 1ère ligne.
            </p>

        </div>
    </div>

    <script>
        const supabase = window.supabase.createClient('https://afkungjbyjxibnkkflab.supabase.co', 'sb_publishable_YI20-tV_eeIysnLJtnoQkA_GcF3VR74');
        let user = JSON.parse(localStorage.getItem('rallyo_user'));
        
        if (!user) window.location.href = 'index.html';
        if (window.lucide) lucide.createIcons();

        document.getElementById('user-balance').textContent = Number(user.balance || 0).toLocaleString();
        
        // Mettre à jour l'affichage du nombre de tours
        let availableSpins = Number(user.wheel_spins || 0);
        document.getElementById('spins-count').textContent = availableSpins;

        let isSpinning = false;
        let currentRotation = 0;
        const PRIX_FIXE = 100;
        const INDEX_PRIX = 2; // Tombe sur 100 FCFA

        async function spinWheel() {
            if (isSpinning) return;
            
            // Vérifier si l'utilisateur a un tour disponible
            if (availableSpins <= 0) {
                alert("Vous n'avez plus de tours disponibles !\nLancez une ligne de production pour en gagner un.");
                return;
            }

            isSpinning = true;
            const btn = document.getElementById('spin-btn');
            btn.textContent = "...";
            btn.disabled = true;

            // Décompter un tour localement
            availableSpins -= 1;
            user.wheel_spins = availableSpins;
            document.getElementById('spins-count').textContent = availableSpins;

            // Calcul de l'angle
            const targetAngle = 1800 + (360 - (INDEX_PRIX * 45) - 22.5) + currentRotation;
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${targetAngle}deg)`;
            currentRotation = targetAngle;

            setTimeout(async () => {
                // Créditer le gain
                const newBalance = Number(user.balance) + PRIX_FIXE;
                user.balance = newBalance;
                
                // Sauvegarder localement
                localStorage.setItem('rallyo_user', JSON.stringify(user));
                
                // Sauvegarder dans Supabase (Solde + Décompte du tour)
                try {
                    await supabase.from('profiles').update({ 
                        balance: newBalance,
                        wheel_spins: availableSpins
                    }).eq('id', user.id);
                } catch(e) {
                    console.log("Erreur d'enregistrement du gain");
                }

                document.getElementById('user-balance').textContent = newBalance.toLocaleString();
                alert(`Félicitations ! Vous avez gagné ${PRIX_FIXE} FCFA !`);
                
                isSpinning = false;
                btn.textContent = "TOUR";
                btn.disabled = false;
            }, 4200);
        }
    </script>
</body>
</html>
