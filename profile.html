<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rallyo - Mon Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-24">

    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
        
        <div class="bg-slate-900 text-white pt-8 pb-12 px-6 rounded-b-3xl shadow-lg relative overflow-hidden">
            <div class="absolute inset-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=800&q=80')] bg-cover bg-center"></div>
            
            <div class="relative z-10">
                <div class="flex items-center gap-4 mb-6">
                    <img src="logo.png" alt="Rallyo" class="w-14 h-14 rounded-2xl shadow-xl border border-white/20">
                    <div>
                        <h2 id="user-phone" class="text-sm font-extrabold text-white tracking-wider">Chargement...</h2>
                        <p class="text-[11px] text-gray-400 mt-0.5">Code Invité : <strong id="user-ref" class="text-red-500">...</strong></p>
                    </div>
                </div>

                <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 mb-4">
                    <p class="text-[10px] uppercase tracking-wider text-gray-400 font-semibold mb-1">Solde disponible</p>
                    <h2 id="user-balance" class="text-2xl font-extrabold text-white">0 FCFA</h2>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="recharge.html" class="bg-white text-gray-900 font-bold py-3 px-4 rounded-xl text-center shadow hover:bg-gray-100 transition text-xs">Dépôt</a>
                    <a href="withdraw.html" class="bg-slate-800 text-white border border-white/20 font-bold py-3 px-4 rounded-xl text-center hover:bg-slate-700 transition text-xs">Retrait</a>
                </div>
            </div>
        </div>

        <div class="flex-1 px-4 py-5 space-y-5">
            <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-4">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Mon Compte</h3>
                <div class="grid grid-cols-3 gap-4 text-center">
                    <a href="lines.html" class="flex flex-col items-center p-2 rounded-2xl hover:bg-gray-50 transition">
                        <div class="w-10 h-10 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700 mb-1.5 shadow-sm"><i data-lucide="layers" class="w-5 h-5"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Mes lignes</span>
                    </a>
                    <a href="bank-account.html" class="flex flex-col items-center p-2 rounded-2xl hover:bg-gray-50 transition">
                        <div class="w-10 h-10 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700 mb-1.5 shadow-sm"><i data-lucide="credit-card" class="w-5 h-5"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Compte retrait</span>
                    </a>
                    <a href="deposit-history.html" class="flex flex-col items-center p-2 rounded-2xl hover:bg-gray-50 transition">
                        <div class="w-10 h-10 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700 mb-1.5 shadow-sm"><i data-lucide="receipt" class="w-5 h-5"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Hist. dépôts</span>
                    </a>
                    <a href="withdraw-history.html" class="flex flex-col items-center p-2 rounded-2xl hover:bg-gray-50 transition">
                        <div class="w-10 h-10 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700 mb-1.5 shadow-sm"><i data-lucide="file-text" class="w-5 h-5"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Hist. retraits</span>
                    </a>
                    <a href="funds-history.html" class="flex flex-col items-center p-2 rounded-2xl hover:bg-gray-50 transition">
                        <div class="w-10 h-10 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700 mb-1.5 shadow-sm"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Hist. fonds</span>
                    </a>
                    <a href="team.html" class="flex flex-col items-center p-2 rounded-2xl hover:bg-gray-50 transition">
                        <div class="w-10 h-10 rounded-2xl bg-gray-50 border border-gray-100 flex items-center justify-center text-gray-700 mb-1.5 shadow-sm"><i data-lucide="users" class="w-5 h-5 text-red-600"></i></div>
                        <span class="text-[11px] font-bold text-gray-700">Mon Équipe</span>
                    </a>
                </div>
            </div>

            <button onclick="logout()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 font-bold py-3.5 rounded-2xl transition text-xs tracking-wider uppercase flex items-center justify-center gap-2">
                <i data-lucide="log-out" class="w-4 h-4"></i>
                <span>Se déconnecter</span>
            </button>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center z-50">
            <a href="home.html" class="flex flex-col items-center text-gray-400"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Accueil</span></a>
            <a href="lines.html" class="flex flex-col items-center text-gray-400"><i data-lucide="layers" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Lignes</span></a>
            <a href="team.html" class="flex flex-col items-center text-gray-400"><i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Équipe</span></a>
            <a href="profile.html" class="flex flex-col items-center text-red-600"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Profil</span></a>
        </div>
    </div>

    <script>
        if (window.lucide) lucide.createIcons();
        const user = JSON.parse(localStorage.getItem('rallyo_user'));
        if (!user) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('user-phone').textContent = user.phone || '+226 00000000';
            document.getElementById('user-ref').textContent = user.referral_code || 'RAL9999';
            document.getElementById('user-balance').textContent = `${Number(user.balance || 0).toLocaleString()} FCFA`;
        }
        function logout() {
            if (confirm("Voulez-vous vraiment vous déconnecter ?")) {
                localStorage.removeItem('rallyo_user');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
