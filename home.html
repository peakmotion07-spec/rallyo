<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rallyo - Accueil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased pb-20">

    <div class="max-w-md mx-auto min-h-screen bg-gray-50 flex flex-col shadow-xl relative">
        
        <div class="bg-slate-900 text-white pt-6 pb-8 px-6 rounded-b-3xl shadow-lg relative overflow-hidden">
            <div class="absolute inset-0 opacity-10 bg-[url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=800&q=80')] bg-cover bg-center"></div>
            
            <div class="relative z-10">
                <div class="flex justify-between items-center mb-6">
                    <div class="flex items-center gap-3">
                        <img src="logo.png" alt="Rallyo" class="w-9 h-9 rounded-xl shadow-lg">
                        <span class="font-bold text-lg tracking-wider">RALLYO</span>
                    </div>
                    <button class="text-gray-300 hover:text-white relative">
                        <i data-lucide="bell" class="w-6 h-6"></i>
                    </button>
                </div>

                <div class="bg-white/10 backdrop-blur-md border border-white/10 rounded-2xl p-4 mb-6">
                    <p class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-1">Solde disponible</p>
                    <div class="flex items-baseline justify-between">
                        <h2 id="user-balance" class="text-3xl font-extrabold text-white">0 FCFA</h2>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="recharge.html" class="bg-white text-gray-900 font-bold py-3.5 px-4 rounded-xl text-center shadow-md hover:bg-gray-100 transition flex items-center justify-center gap-2">
                        <i data-lucide="arrow-down-left" class="w-5 h-5 text-red-600"></i>
                        <span>Dépôt</span>
                    </a>
                    <a href="withdraw.html" class="bg-slate-800 text-white border border-white/20 font-bold py-3.5 px-4 rounded-xl text-center hover:bg-slate-700 transition flex items-center justify-center gap-2">
                        <i data-lucide="arrow-up-right" class="w-5 h-5 text-gray-300"></i>
                        <span>Retrait</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="flex-1 px-4 py-5 space-y-5">
            
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-red-50 flex items-center justify-center text-red-600">
                        <i data-lucide="calendar-check" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-gray-900">Pointage quotidien</h3>
                        <p id="claim-subtitle" class="text-xs text-gray-500">Réclamez votre bonus de connexion</p>
                    </div>
                </div>
                <button onclick="claimDaily()" id="claim-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-sm transition">
                    +50 FCFA
                </button>
            </div>

            <div class="relative bg-gradient-to-r from-red-600 to-red-700 text-white rounded-2xl p-5 overflow-hidden shadow-lg shadow-red-600/20">
                <div class="relative z-10 pr-20">
                    <span class="bg-white/20 text-[10px] font-bold uppercase px-2.5 py-1 rounded-full">Roue de la fortune</span>
                    <h3 class="text-xl font-black mt-2 mb-1">Gagnez jusqu'à 30 000 FCFA</h3>
                    <p class="text-xs text-red-100 mb-4">Un tour offert à chaque ligne achetée.</p>
                    <a href="wheel.html" class="inline-block bg-white text-red-600 font-bold text-xs px-4 py-2 rounded-xl shadow">Découvrir</a>
                </div>
                <div class="absolute -right-4 -bottom-6 w-32 h-32 opacity-20 bg-[url('https://cdn-icons-png.flaticon.com/512/3599/3599119.png')] bg-cover"></div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-base text-gray-900">Lignes recommandées</h3>
                    <a href="lines.html" class="text-xs font-bold text-red-600">Tout voir ></a>
                </div>

                <div id="plans-container" class="space-y-3">
                    <!-- Dynamique -->
                </div>
            </div>
        </div>

        <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center z-50">
            <a href="home.html" class="flex flex-col items-center text-red-600"><i data-lucide="home" class="w-5 h-5"></i><span class="text-[10px] font-bold mt-1">Accueil</span></a>
            <a href="lines.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="layers" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Lignes</span></a>
            <a href="team.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="users" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Équipe</span></a>
            <a href="profile.html" class="flex flex-col items-center text-gray-400 hover:text-gray-600"><i data-lucide="user" class="w-5 h-5"></i><span class="text-[10px] font-semibold mt-1">Profil</span></a>
        </div>
    </div>

    <script>
        // 1. On lit la mémoire du téléphone AVANT le réseau
        let user = JSON.parse(localStorage.getItem('rallyo_user'));
        if (!user) window.location.href = 'index.html';
        
        // Affichage instantané du solde (plus de bug à 0)
        document.getElementById('user-balance').textContent = Number(user.balance || 0).toLocaleString() + " FCFA";

        // 2. On initialise les icônes
        if (window.lucide) lucide.createIcons();

        // 3. Fonctions de pointage (intégrées directement pour éviter les bugs)
        function checkDailyClaimStatus() {
            const today = new Date().toISOString().split('T')[0];
            if (user.last_claim_date === today) {
                const btn = document.getElementById('claim-btn');
                if(btn) {
                    btn.textContent = "Déjà pointé";
                    btn.disabled = true;
                    btn.className = "bg-gray-300 text-gray-600 font-bold text-xs px-4 py-2.5 rounded-xl cursor-not-allowed";
                    document.getElementById('claim-subtitle').textContent = "Revenez demain";
                }
            }
        }
        checkDailyClaimStatus();

        async function claimDaily() {
            const today = new Date().toISOString().split('T')[0];
            if (user.last_claim_date === today) return alert("Déjà réclamé aujourd'hui !");
            
            let newBalance = Number(user.balance) + 50;
            user.balance = newBalance;
            user.last_claim_date = today;
            localStorage.setItem('rallyo_user', JSON.stringify(user));
            
            document.getElementById('user-balance').textContent = newBalance.toLocaleString() + " FCFA";
            document.getElementById('claim-btn').textContent = "Déjà pointé";
            document.getElementById('claim-btn').disabled = true;
            document.getElementById('claim-btn').className = "bg-gray-300 text-gray-600 font-bold text-xs px-4 py-2.5 rounded-xl cursor-not-allowed";
            document.getElementById('claim-subtitle').textContent = "Revenez demain";
            
            alert("Bonus de 50 FCFA récupéré !");
            
            // Mise à jour Supabase en arrière-plan
            try {
                const supabase = window.supabase.createClient('https://afkungjbyjxibnkkflab.supabase.co', 'sb_publishable_YI20-tV_eeIysnLJtnoQkA_GcF3VR74');
                await supabase.from('profiles').update({ balance: newBalance, last_claim_date: today }).eq('id', user.id);
            } catch(e) {}
        }

        // 4. Chargement des lignes recommandées
        function loadPlans() {
            const displayPlans = [
                { category: "Grand public", title: "Ligne Cuisine & Maison", daily_income: 1000, price: 4000 },
                { category: "Grand public", title: "Ligne Électroménager", daily_income: 2530, price: 10000 }
            ];

            const container = document.getElementById('plans-container');
            if(!container) return;

            container.innerHTML = displayPlans.map(plan => `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between">
                    <div>
                        <span class="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-md">${plan.category.toUpperCase()}</span>
                        <h4 class="font-bold text-sm text-gray-900 mt-1">${plan.title}</h4>
                        <p class="text-xs text-gray-500 mt-0.5">Revenu : <strong class="text-green-600">${plan.daily_income.toLocaleString()} FCFA</strong> / jour</p>
                    </div>
                    <div class="text-right">
                        <span class="block font-black text-gray-900 text-sm">${plan.price.toLocaleString()} FCFA</span>
                        <a href="lines.html" class="inline-block mt-2 bg-red-50 hover:bg-red-600 hover:text-white text-red-600 text-xs font-bold px-3 py-1.5 rounded-xl transition">Lancer</a>
                    </div>
                </div>
            `).join('');
        }
        loadPlans();
    </script>
</body>
</html>
